services:
  - type: web
    name: medical-room-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python -m gunicorn medical_room.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /tmp/medical_room_demo.sqlite3
      - key: SECRET_KEY
        generateValue: true
