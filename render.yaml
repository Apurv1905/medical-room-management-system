
services:
  - type: web
    name: medical-room-demo
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput

    startCommand: python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true) && python manage.py import_sample_data && python -m gunicorn medical_room.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5

      - key: DJANGO_DEBUG
        value: "false"

      - key: DATABASE_PATH
        value: /tmp/medical_room_demo.sqlite3

      - key: SECRET_KEY
        generateValue: true

      - key: DJANGO_SUPERUSER_USERNAME
        value: Apurv1905

      - key: DJANGO_SUPERUSER_EMAIL
        value: your-email@example.com

      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
